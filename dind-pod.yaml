
apiVersion: v1
kind: Pod
metadata:
  name: dind-pod
  labels:
    app: dind-pod
spec:
  containers:
    - name: docker-engine
      image: docker:27-dind
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
      ports:
        - containerPort: 8081
          name: application
          protocol: TCP
