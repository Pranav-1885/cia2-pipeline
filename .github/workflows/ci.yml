name: Library Catalog CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Test, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Build and test application
      - name: Build and test with Maven
        run: mvn -B clean verify

      # Step 4: Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/pranav-1885/library-book-catalog:latest \
            -t ghcr.io/pranav-1885/library-book-catalog:${{ github.sha }} .

      # Step 5: Login to GHCR
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # Step 6: Push images to GHCR
      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/pranav-1885/library-book-catalog:latest
          docker push ghcr.io/pranav-1885/library-book-catalog:${{ github.sha }}

      # Step 7: Azure Login for AKS Deployment
      - name: Azure Login
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 8: Set AKS Context
      - name: Set AKS Cluster Context
        if: github.event_name == 'push'
        uses: azure/aks-set-context@v3
        with:
          resource-group: 'devops-cia2-rg'
          cluster-name: 'library-aks-cluster'

      # Step 9: Deploy to Kubernetes Cluster
      - name: Deploy to AKS
        if: github.event_name == 'push'
        uses: Azure/k8s-deploy@v5
        with:
          manifests: |
            deployment.yaml
            service.yaml
          images: |
            ghcr.io/pranav-1885/library-book-catalog:${{ github.sha }}
          namespace: 'default'