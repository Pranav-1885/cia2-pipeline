
name: Library Catalog CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test and Docker Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Java 21 and Maven caching
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Compile, run tests and package the application
      - name: Build and test with Maven
        run: mvn -B clean verify

      # Step 4: Build the Docker image
      - name: Build Docker image
        run: docker build -t library-book-catalog:${{ github.sha }} .
